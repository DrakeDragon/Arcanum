<style>
:root{
  --bg:#09061a; --bg2:#100a26; --panel:#171132; --panel2:#201848; --line:rgba(255,255,255,.09);
  --text:#efeaff; --muted:#a99fd0; --cyan:#22e6f2; --magenta:#ff3fd0; --gold:#e8c56b; --good:#5ff0b0; --warn:#ffb86b;
  --r:16px; --nav:4rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.55;overscroll-behavior-y:none}
body{background:radial-gradient(1200px 600px at 20% -10%,#2a0f55 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#06303a 0%,transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + 90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,rgba(9,6,26,.96),rgba(9,6,26,.82));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .logo{font-family:Georgia,"Times New Roman",serif;font-size:1.375rem;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
header.top .logo small{display:block;font-size:0.625rem;letter-spacing:.22em;color:var(--muted);-webkit-text-fill-color:var(--muted)}
.iconbtn{width:2.625rem;height:2.625rem;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:1.1875rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
main#view{padding:14px 14px 20px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
h1{font-size:1.625rem}h2{font-size:1.3125rem}h3{font-size:1.0625rem}
p{margin:0 0 .85em}
.muted{color:var(--muted)}.small{font-size:0.8125rem}.tiny{font-size:0.7188rem}
.center{text-align:center}
.gold{color:var(--gold)}.cyan{color:var(--cyan)}.mag{color:var(--magenta)}
a{color:var(--cyan)}
.panel{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel.glow{box-shadow:0 0 0 1px rgba(34,230,242,.18),0 10px 40px -12px rgba(255,63,208,.35)}
.panel h2:first-child,.panel h3:first-child{margin-top:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:2.875rem;padding:0 20px;border-radius:999px;border:0;font-size:1rem;font-weight:600;cursor:pointer;color:#0a0618;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 6px 22px -8px rgba(255,63,208,.6)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.22);box-shadow:none}
.btn.small{min-height:2.25rem;padding:0 14px;font-size:0.875rem}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;text-align:left;padding:14px;border-radius:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);color:var(--text);cursor:pointer;font:inherit}
.tile b{display:block;font-family:Georgia,serif;font-size:1rem;margin-bottom:2px}
.tile span{font-size:0.7812rem;color:var(--muted)}
.tile .ic{font-size:1.5rem;display:block;margin-bottom:6px}
label.f{display:block;font-size:0.8125rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:2.875rem;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#0d0820;color:var(--text);font-size:1rem;font-family:inherit}
textarea{min-height:5.25rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:1px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;min-height:2.375rem;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:0.875rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.seg button.on{background:linear-gradient(90deg,rgba(34,230,242,.22),rgba(255,63,208,.22));color:var(--text);border-color:rgba(34,230,242,.6)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:0.75rem;background:rgba(255,255,255,.08);color:var(--text);margin:2px 4px 2px 0}
.chip.c{background:rgba(34,230,242,.16);color:var(--cyan)}.chip.m{background:rgba(255,63,208,.16);color:#ff8be6}.chip.g{background:rgba(232,197,107,.16);color:var(--gold)}
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:rgba(9,6,26,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav#nav .in{display:flex;width:100%;max-width:680px}
nav#nav button{flex:1;height:var(--nav);background:none;border:0;color:var(--muted);font-size:0.6875rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
nav#nav button .ni{font-size:1.3125rem;line-height:1}
nav#nav button.on{color:var(--cyan)}
nav#nav button.on .ni{filter:drop-shadow(0 0 8px var(--cyan))}
#player{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom));z-index:45;max-width:660px;margin:0 auto;display:none}
#player.on{display:block}
#player .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:linear-gradient(90deg,#14264a,#3a1056);border:1px solid rgba(34,230,242,.5);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#player .pt{flex:1;font-size:0.8125rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .pt b{display:block;color:var(--cyan);font-size:0.75rem;letter-spacing:.08em;text-transform:uppercase}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--cyan);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.2s;background:var(--magenta)}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s;background:var(--magenta)}
@keyframes eq{0%,100%{height:3px}50%{height:16px}}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(3,1,12,.78);backdrop-filter:blur(4px)}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;top:34px;max-width:680px;margin:0 auto;background:linear-gradient(180deg,#1b1340,#0d0822);border-radius:22px 22px 0 0;border:1px solid var(--line);overflow:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#sheet .grab{position:sticky;top:-16px;z-index:2;display:flex;justify-content:space-between;align-items:center;margin:-16px -16px 8px;padding:12px 16px;background:linear-gradient(180deg,#1b1340,rgba(27,19,64,.92))}
.sheet-card{width:min(62%,230px);margin:4px auto 14px;filter:drop-shadow(0 12px 28px rgba(0,0,0,.65))}
.sec{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.sec h4{margin:0 0 4px;font-size:0.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.sec p{margin:0;font-size:0.9688rem}
.sec.sp{outline:2px solid var(--magenta);background:rgba(255,63,208,.1);box-shadow:0 0 24px rgba(255,63,208,.35)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:0.875rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* cards */
.card-svg{display:block;width:100%;height:auto}
.cf-paper{fill:var(--paper)}.cf-edge{stroke:var(--edge);fill:none}.cf-ink{fill:var(--ink)}.cf-inks{stroke:var(--ink);fill:none}.cf-accent{fill:var(--accent)}.cf-accs{stroke:var(--accent);fill:none}
.cf-band{fill:var(--band)}.cf-bandt{fill:var(--bandtxt)}
.d-classic{--paper:#f3e8cc;--ink:#3a2918;--edge:#b98a2e;--accent:#8c2f39;--band:#3a2918;--bandtxt:#f3e8cc;--wands:#c4531b;--cups:#17789a;--swords:#4a56a6;--pentacles:#8f7010;--glow:rgba(232,197,107,.5)}
.d-thoth{--paper:#0e3a3f;--ink:#e6cf86;--edge:#e6cf86;--accent:#d45a45;--band:#06222a;--bandtxt:#f4e6b0;--wands:#ff8a5a;--cups:#6fe3ff;--swords:#b9c8ff;--pentacles:#ffd66b;--glow:rgba(230,207,134,.5)}
.d-marseille{--paper:#f2e4bf;--ink:#1c2b5e;--edge:#c1272d;--accent:#e2b02e;--band:#1c2b5e;--bandtxt:#f2e4bf;--wands:#2f7d3a;--cups:#c1272d;--swords:#1c2b5e;--pentacles:#cf9a16;--glow:rgba(193,39,45,.45)}
.d-obsidian{--paper:#07070f;--ink:#d6f7ff;--edge:#22e6f2;--accent:#ff3fd0;--band:#16062a;--bandtxt:#22e6f2;--wands:#ff7a3d;--cups:#22e6f2;--swords:#b9c7ff;--pentacles:#ffe066;--glow:rgba(34,230,242,.55)}
.d-celestial{--paper:#10103a;--ink:#dfe4ff;--edge:#b9b4ff;--accent:#9a85ff;--band:#080826;--bandtxt:#dfe4ff;--wands:#ffa56b;--cups:#79d9ff;--swords:#cfd6ff;--pentacles:#f4d77b;--glow:rgba(154,133,255,.55)}
.flipwrap{perspective:900px}
.slot{position:absolute}
.slot .flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.slot.revealed .flip{transform:rotateY(180deg)}
.slot .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:9px;overflow:hidden}
.slot .face.front{transform:rotateY(180deg)}
.slot .face svg{width:100%;height:100%}
.slot .back{cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.7)}
.slot.revealed .front{box-shadow:0 0 0 1px var(--edge),0 0 22px var(--glow),0 10px 22px rgba(0,0,0,.6);cursor:pointer}
.slot .rev svg{transform:rotate(180deg)}
.slot .badge{position:absolute;top:-7px;left:-5px;z-index:3;min-width:20px;height:20px;border-radius:10px;background:var(--magenta);color:#0a0618;font-size:0.6875rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.slot .lab{position:absolute;left:-6px;right:-6px;top:100%;margin-top:3px;text-align:center;font-size:0.625rem;line-height:1.2;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot.speaking .face{box-shadow:0 0 0 3px var(--magenta),0 0 34px var(--magenta)}
.slot.cross{z-index:3}
.slot.cross .flip{transform-origin:center}
.slot.cross.revealed .flip{transform:rotateY(180deg)}
.spread{position:relative;margin:6px auto 12px}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,230,242,.0)}50%{box-shadow:0 0 22px 2px rgba(34,230,242,.45)}}
.dealin{animation:dealin .45s both}
@keyframes dealin{from{opacity:0;translate:0 -30px;scale:.8}to{opacity:1;translate:0 0;scale:1}}
.stack{position:relative;width:110px;margin:16px auto}
.stack svg{position:absolute;left:0;top:0;width:100%;border-radius:9px;box-shadow:0 6px 16px rgba(0,0,0,.6)}
.shuffling .s1{animation:sh1 .5s infinite alternate}.shuffling .s2{animation:sh2 .5s infinite alternate}.shuffling .s3{animation:sh3 .5s infinite alternate}
@keyframes sh1{to{transform:translateX(-60px) rotate(-10deg)}}@keyframes sh2{to{transform:translateX(60px) rotate(10deg)}}@keyframes sh3{to{transform:translateY(-14px)}}

.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:520px){.cardgrid{grid-template-columns:repeat(4,1fr)}}
.cg{background:none;border:0;padding:0;color:var(--text);cursor:pointer;text-align:center;font:inherit}
.cg svg{border-radius:8px;box-shadow:0 6px 16px -6px rgba(0,0,0,.7)}
.cg span{display:block;font-size:0.7188rem;margin-top:5px;line-height:1.2;color:var(--muted)}

.spcat{margin:12px 0 4px;font-size:0.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.spbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font:inherit}
.spbtn.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px -6px var(--cyan)}
.spbtn .n{flex:0 0 40px;height:2.5rem;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#0a0618;font-weight:800;display:flex;align-items:center;justify-content:center}
.spbtn b{display:block}.spbtn span{font-size:0.7812rem;color:var(--muted)}
.big{font-family:Georgia,serif;font-size:2.75rem;line-height:1;background:linear-gradient(135deg,var(--cyan),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent}
.numrow{display:flex;gap:12px;align-items:center}
.numbadge{flex:0 0 74px;height:74px;border-radius:18px;background:linear-gradient(160deg,#241a58,#120b30);border:1px solid rgba(34,230,242,.35);display:flex;flex-direction:column;align-items:center;justify-content:center}
.numbadge .big{font-size:2.25rem}.numbadge small{font-size:0.625rem;color:var(--muted)}
details.acc{margin-bottom:10px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg2));overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:14px;display:flex;align-items:center;gap:12px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .sm{flex:1}
details.acc>summary .sm b{display:block;font-family:Georgia,serif}
details.acc>summary .sm span{font-size:0.7812rem;color:var(--muted)}
details.acc>summary:after{content:"\25BE";color:var(--muted);transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(180deg)}
details.acc .bd{padding:0 14px 14px}
.say{border:1px solid rgba(34,230,242,.5);background:rgba(34,230,242,.1);color:var(--cyan);border-radius:999px;min-height:2.125rem;padding:0 12px;font-size:0.8125rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.lo{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:210px;margin:8px 0}
.lo div{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#0d0820;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:1.1875rem;position:relative}
.lo div.has{background:linear-gradient(160deg,rgba(34,230,242,.2),rgba(255,63,208,.2));border-color:rgba(34,230,242,.5)}
.lo div i{position:absolute;right:5px;bottom:2px;font-size:0.625rem;color:var(--muted);font-style:normal}
table.t{width:100%;border-collapse:collapse;font-size:0.875rem}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:0.7188rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
.letters .lt{width:28px;text-align:center;border-radius:6px;background:rgba(255,255,255,.07);padding:3px 0}
.letters .lt b{display:block;font-size:0.875rem}.letters .lt i{display:block;font-style:normal;font-size:0.6875rem;color:var(--cyan)}
.letters .lt.v{background:rgba(255,63,208,.18)}
.stone{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:74px;height:84px;border-radius:30px 30px 34px 34px;margin:6px;background:radial-gradient(circle at 30% 25%,#5a4a86,#201840);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 14px rgba(0,0,0,.6),0 8px 18px rgba(0,0,0,.5);cursor:pointer}
.stone .g{font-size:2.5rem;line-height:1;color:var(--gold);text-shadow:0 0 14px rgba(232,197,107,.7)}
.stone .g.rv{transform:rotate(180deg)}
.stone small{font-size:0.625rem;color:var(--muted)}
.hexlines{display:flex;flex-direction:column-reverse;gap:8px;width:140px;margin:8px auto}
.hl{height:12px;display:flex;gap:16px;position:relative}
.hl i{flex:1;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:3px}
.hl.chg::after{content:"\25CF";position:absolute;right:-20px;top:-3px;font-size:0.75rem;color:var(--gold)}
.good{color:var(--good)}.bad{color:#ff8a8a}.warn{color:var(--warn)}
.answer{font-family:Georgia,serif;font-size:2.625rem;text-align:center;margin:6px 0}
.hr{height:1px;background:var(--line);margin:14px 0}
.notice{font-size:0.7812rem;color:var(--muted);border-left:3px solid var(--magenta);padding:2px 0 2px 10px;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.jr{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--panel);margin-bottom:10px}
.mini{display:flex;gap:4px;margin-top:8px}.mini svg{width:34px;height:auto;border-radius:4px}
.moonbig{font-size:4rem;text-align:center;line-height:1.1;filter:drop-shadow(0 0 20px rgba(232,197,107,.5))}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta))}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 100px);transform:translateX(-50%);z-index:80;background:#1d1344;border:1px solid var(--cyan);padding:10px 16px;border-radius:999px;font-size:0.875rem;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.fade{animation:fade .35s both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ACCESSIBILITY */
html.hc{--bg:#000;--bg2:#050310;--panel:#0b0720;--panel2:#120a30;--text:#fff;--muted:#e2dcff;--line:rgba(255,255,255,.55)}
html.hc body{background:#000}
html.hc .muted{color:#e2dcff}
html.hc .btn.ghost,html.hc .seg button,html.hc input,html.hc select,html.hc textarea{border-color:rgba(255,255,255,.7)}
html.bold body{font-weight:600}
html.bold h1,html.bold h2,html.bold h3,html.bold b{font-weight:800}
html.wide body{line-height:1.85;letter-spacing:.02em;word-spacing:.08em}
html.bigbtn .btn{min-height:3.4rem;padding:0 1.6rem}
html.bigbtn .btn.small{min-height:2.9rem}
html.bigbtn .seg button{min-height:3rem}
html.bigbtn .iconbtn{width:3.2rem;height:3.2rem}
nav#nav button{min-height:var(--nav);height:auto;padding:4px 0}
header.top .iconbtn{flex:0 0 auto}
header.top{flex-wrap:nowrap}
header.top .logo{min-width:0;overflow:hidden}
header.top .logo{font-size:min(1.375rem,24px)}
header.top .logo small{font-size:min(.625rem,10px)}
header.top .iconbtn{width:min(2.625rem,52px);height:min(2.625rem,52px);font-size:min(1.1875rem,22px)}
html.big header.top .logo small{display:none}
nav#nav button{font-size:min(.6875rem,13px)}
nav#nav button .ni{font-size:min(1.3rem,26px)}
html.bigbtn header.top .iconbtn{width:56px;height:56px}
h5.ph{margin:12px 0 2px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);font-weight:700}
/* user art override */
.cardart,.artslot{position:relative;width:100%;height:100%;container-type:inline-size}
.artimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6.5% / 4%;display:none;background:#000}
.hasart>.artimg{display:block}
.hasart>div:first-child,.hasart>svg{visibility:hidden}
.artcap{display:none;position:absolute;left:6%;right:6%;bottom:3.5%;text-align:center;background:rgba(10,6,24,.8);color:#fff;font-family:Georgia,serif;font-size:7.2cqw;line-height:1.15;padding:2.2cqw 1cqw;border-radius:2.4cqw;border:1px solid rgba(255,255,255,.25)}
.hasart>.artcap{display:block}
.artslot.sq{aspect-ratio:1/1}
.artslot.wide{aspect-ratio:16/9}
.artslot .artimg{border-radius:14px}
.artslot.opt:not(.hasart){display:none}
.artslot.opt.sq{max-width:280px;margin:8px auto}
.artslot.opt.wide{height:auto;margin-bottom:12px}
.cardart{height:auto;aspect-ratio:200/330}

.tonebtn.on{background:linear-gradient(90deg,rgba(34,230,242,.3),rgba(255,63,208,.3));border-color:var(--cyan)}
#player .pl+.pl{margin-top:6px}

/* Arcanum's illustrated reading room */
html:not(.hc) {
  --bg:#16111b; --bg2:#1d1723; --panel:#251d2b; --panel2:#302435;
  --line:#49384b; --text:#f8eedc; --muted:#c9b8bf;
  --cyan:#ebcb98; --magenta:#e7a8ad; --gold:#ebcb98; --r:20px;
}
html:not(.hc) body {
  background:radial-gradient(ellipse at 50% 0%,#382638 0%,transparent 48rem),var(--bg);
}
html:not(.hc) header.top,html:not(.hc) nav#nav {background:rgba(22,17,27,.96)}
html:not(.hc) header.top .logo {background:none;color:var(--gold);font-size:1.55rem}
html:not(.hc) #sheet .box,html:not(.hc) #sheet .grab {background:var(--bg2)}
html:not(.hc) input[type=text],html:not(.hc) input[type=date],html:not(.hc) input[type=number],
html:not(.hc) select,html:not(.hc) textarea {background:#17111b}
html:not(.hc) .panel.glow {box-shadow:0 14px 42px #0c081180}
html:not(.hc) .btn:not(.ghost) {background:linear-gradient(135deg,#f2d6a9,#c99a6e);box-shadow:0 6px 16px #0e090e75}
html:not(.hc) nav#nav button.on .ni {filter:none}
html:not(.hc) .seg button.on,html:not(.hc) .spbtn.on {border-color:var(--gold);background:#473445}
main#view {padding:18px clamp(12px,4vw,24px) 24px}
h1,h2,h3 {font-family:"Baskerville","Palatino Linotype",Georgia,serif}
.home-hero {
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  min-height:clamp(17rem,52vw,23rem);padding:clamp(18px,5vw,34px);
  background:linear-gradient(90deg,#19111cf2 4%,#19111cc9 38%,#19111c15 100%),url("art/editions/hero.webp") 62% center/cover,#211723;
}
.home-hero h1 {font-size:clamp(1.8rem,6vw,2.8rem);max-width:11ch;color:#fff5df}
.home-hero .small {color:#e7d8cc}
.home-hero .btn {margin-top:1.1rem}
.deck-panel {padding:clamp(12px,4vw,20px)}
.edition-choices {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.edition-choice,.original-choice {
  min-width:0;color:var(--text);background:var(--bg2);border:1px solid var(--line);
  border-radius:14px;padding:5px;cursor:pointer;font:inherit;text-align:center;
}
.edition-choice[aria-pressed=true],.original-choice[aria-pressed=true] {border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.edition-preview {display:block;position:relative;aspect-ratio:1.35;overflow:hidden;border-radius:10px;background:var(--panel2)}
.edition-choice-name {display:block;padding:.5em .15em;font-family:Georgia,serif;font-size:1rem;line-height:1.25;overflow-wrap:anywhere}
.other-decks {margin-top:12px}
.other-decks summary {cursor:pointer;min-height:2rem;color:var(--muted)}
.original-choices {display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6.5rem),1fr));gap:8px;margin:.6rem 0}
.original-choice {font-size:.78rem;line-height:1.25}
.original-choice > div {aspect-ratio:200/330;margin-bottom:6px}
.deck-note {margin:.65rem 0 0}
.edition-face {
  position:relative;isolation:isolate;container-type:inline-size;overflow:hidden;width:100%;height:100%;
  border-radius:7%;background:#251b25;box-shadow:0 8px 24px #08060982;
  --card-edge:#ead39b;--card-label:#201829;
}
.edition-face.d-wonderland {--card-edge:#f4d2a5;--card-label:#431e30}
.edition-image {position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.edition-fallback {position:absolute;inset:0}
.edition-face::after {content:"";position:absolute;inset:4%;z-index:2;border:1px solid var(--card-edge);border-radius:5%;pointer-events:none}
.edition-caption {
  position:absolute;z-index:3;bottom:7%;left:7%;right:7%;padding:4% 2%;
  color:#fff0d3;background:var(--card-label);border:1px solid var(--card-edge);border-radius:5px;
  font:700 8.5cqw/1.08 Georgia,serif;text-align:center;overflow-wrap:anywhere;
}
.edition-back .edition-image {filter:brightness(.73)}
.back-medallion {position:absolute;z-index:3;inset:32%;display:grid;place-items:center;border:1px solid var(--card-edge);border-radius:50%;background:var(--card-label);color:var(--card-edge);font:normal 26cqw/1 Georgia,serif}
.slot .rev .edition-face,.slot .rev .artimg,.slot .rev .artcap {rotate:180deg}
.slot .rev .edition-face svg {transform:none}
:where(button,summary):focus-visible {outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce) {
  .slot .flip {transition:none}
}
.cardart > .artimg {z-index:4}
.cardart > .artcap {z-index:5}
.edition-face:not(.edition-back) > .edition-image {height:86%}

/* Illustrated chapters, directory and profiles */
.brand {display:flex;align-items:center;gap:.7rem;flex:1;min-width:0}
.brand-mark {
  flex:none;width:2.1rem;aspect-ratio:1;display:grid;place-items:center;
  border:1px solid var(--gold);border-radius:50%;color:var(--gold);
  font:1.5rem/1 Georgia,serif;
}
header.top .brand .logo {letter-spacing:.12em;font-size:clamp(1rem,4.2vw,1.55rem)}
header.top .iconbtn {flex:none}
@media(max-width:370px) {
  header.top {gap:6px;padding-inline:10px}
  header.top .iconbtn {width:2.2rem;height:2.2rem}
  .brand {gap:.38rem}
  .brand-mark {width:1.65rem}
}
.chapter-art,.art-tile,.daily-art {
  position:relative;isolation:isolate;overflow:hidden;background:#251b2b;
}
.world-image {display:block;width:100%;height:100%;object-fit:cover}
.chapter-art .world-image,.art-tile .world-image,.daily-art .world-image {
  position:absolute;inset:0;z-index:-2;
}
.chapter-art::after,.art-tile::after,.daily-art::after {
  position:absolute;inset:0;z-index:-1;content:"";pointer-events:none;
}
.chapter-art {
  display:flex;align-items:flex-end;min-height:clamp(8.5rem,29vw,13rem);
  padding:clamp(.8rem,4vw,1.5rem);margin-bottom:14px;
  border:1px solid var(--line);border-radius:var(--r);
}
.chapter-art .world-image {object-position:center 49%}
.chapter-art::after {background:linear-gradient(90deg,#1b121df0,#22142384 57%,#22142312),linear-gradient(0deg,#110a14bb,transparent 65%)}
.chapter-title {
  color:#fff1d6;font:600 clamp(1.8rem,7vw,2.75rem)/1.08 Baskerville,"Palatino Linotype",Georgia,serif;
  text-shadow:0 2px 12px #100b13;
}
.home-directory {margin:0 0 14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.art-tile {
  display:flex;align-items:flex-end;min-width:0;min-height:clamp(8.3rem,33vw,11rem);
  padding:clamp(.65rem,3vw,1rem);border-radius:16px;
}
.art-tile::after {background:linear-gradient(0deg,#150e19 4%,#211425e0 38%,#21142505 88%)}
.art-tile .world-image {object-position:center 43%}
.art-tile-label b {color:#fff1d6;font-size:1.03rem}
.art-tile-label span {display:block;color:#e8d7d5;line-height:1.32}
.art-tile:hover,.art-tile:focus-visible {border-color:var(--gold)}
.daily-panel {position:relative;isolation:isolate;overflow:hidden}
.daily-art {position:absolute;inset:0 0 auto;z-index:-1;height:min(19rem,100%);background:none}
.daily-art::after {background:linear-gradient(0deg,var(--bg2),#22162688 58%,#1c121db0)}
.daily-art .world-image {object-position:center 44%}
.daily-panel .slot {box-shadow:0 8px 32px #0b0713bf}
.profile-art {display:grid;max-width:min(100%,24rem);margin:12px auto 16px}
.world-portrait,.profile-override {
  grid-area:1/1;align-self:start;aspect-ratio:1;width:100%;
  overflow:hidden;border-radius:14px;
}
.world-portrait {border:1px solid var(--line);box-shadow:0 10px 28px #100b13aa}
.profile-art .profile-override {max-width:none;margin:0}
.profile-override .artimg {object-position:center}
html.hc .chapter-art::after,html.hc .art-tile::after {background:#000b}
html.hc .daily-art {display:none}
html.big .home-directory {grid-template-columns:1fr}
nav#nav button .ni {font-family:Georgia,"Segoe UI Symbol",serif;font-size:1.42rem;color:var(--gold);opacity:.7}
nav#nav button.on .ni {opacity:1}
nav#nav button.on {box-shadow:inset 0 2px var(--gold)}

.reading-share {max-width:36rem;margin:0 auto;padding-bottom:1rem}
.share-preview {display:block;width:min(100%,25rem);height:auto;margin:0 auto 1rem;border:1px solid var(--line);border-radius:12px}
.share-actions {justify-content:center}
.share-actions a {text-decoration:none}
#reading-caption {min-height:9rem}

.hand-actions {justify-content:center;margin:.55rem 0}
.hand-fan {
  display:flex;align-items:center;overflow-x:auto;overscroll-behavior-inline:contain;
  padding:10px 9px 15px;margin:0 0 8px;scrollbar-color:var(--gold) var(--bg2);
}
.hand-card {
  flex:0 0 62px;width:62px;aspect-ratio:200/330;position:relative;
  padding:0;margin-right:-13px;border:1px solid var(--gold);border-radius:7px;
  background:var(--panel2);cursor:pointer;
}
.hand-card:last-child {margin-right:0}
.hand-card:focus-visible,.hand-card:hover {z-index:1;transform:translateY(-5px)}
.hand-card:disabled {opacity:.23;cursor:default;transform:none}
.hand-card svg {display:block;width:100%;height:100%}
.hand-card .edition-face {box-shadow:none}
.hand-card:nth-child(4n+1) {rotate:-3deg}
.hand-card:nth-child(4n+3) {rotate:3deg}

.edition-choices {grid-template-columns:repeat(auto-fit,minmax(min(100%,8.1rem),1fr))}
.edition-face.d-felix {--card-edge:#edcc8a;--card-label:#241a16;background:#2d201b}
#library-deck {margin-bottom:.6rem}

.deck-gallery {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;margin:0 0 1.35rem}
.gallery-entry {overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.gallery-image {display:block;width:100%;aspect-ratio:1;object-fit:cover}
.gallery-copy {padding:.75rem}
.gallery-copy h3 {font-size:1.14rem;overflow-wrap:anywhere}
.gallery-copy p {margin-bottom:.65rem;color:var(--muted);font-size:.84rem;line-height:1.45}
.gallery-copy p:last-child {margin-bottom:0}
html.big .deck-gallery {grid-template-columns:1fr}

.edition-face.d-celtic {--card-edge:#e3c88a;--card-label:#122e29;background:#233a30}
.edition-face.d-wiccan {--card-edge:#e5d3f4;--card-label:#32213f;background:#31273f}
.has-edition-image > .edition-fallback {visibility:hidden}
.edition-face.d-felix:not(.edition-back).has-edition-image {background:#ead1a3}
.edition-face.d-felix:not(.edition-back) > .edition-image {inset:9% 4% auto;width:92%;height:auto;aspect-ratio:1}
.edition-face.d-felix:not(.edition-back)::after {--card-edge:#8e6940}
.edition-face:is(.d-celtic,.d-wiccan):not(.edition-back) > .edition-image {
  inset:9% 4% auto;width:92%;height:auto;aspect-ratio:1;
}

.gallery-image[hidden] {display:none}
.edition-back.has-edition-image > .back-medallion {display:none}
.edition-back.has-edition-image > .edition-image {filter:none;object-fit:contain}

.journal-filters > .f:first-child {margin-top:0}
.journal-favorite-filter {margin-top:.8rem}
.journal-favorite-filter input {width:1.25rem;height:1.25rem;accent-color:var(--gold)}
.journal-open {font:inherit;font-weight:700;color:var(--gold);background:none;border:0;padding:0;text-align:left;min-height:2.25rem;cursor:pointer}
.journal-open:hover {text-decoration:underline}
.journal-question {display:block;overflow-wrap:anywhere}
.journal-thumb {display:block;flex:0 0 34px;aspect-ratio:200/330}
.journal-thumb.reversed {rotate:180deg}
.journal-entry .mini {flex-wrap:wrap;align-items:center}
.journal-tag-editor > input[type=text] {flex:1 1 14rem}
[data-a=jfavorite][aria-pressed=true] {border-color:var(--gold);color:var(--gold)}
[data-a=jfavorite][aria-pressed=true]::before {content:"★"}
.journal-interpretation summary {cursor:pointer;font-weight:600;color:var(--gold)}
.journal-reading-parts {padding-top:.65rem}
.journal-reading-parts p:last-child,.reading-reflection p:last-child {margin-bottom:0}
.reading-reflection h4 {margin:0 0 .25rem}

.share-formats {justify-content:center;margin-bottom:.75rem}
.share-formats .btn[aria-pressed=true] {color:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.share-formats .btn span {font-size:.73rem;color:var(--muted)}
.share-actions {margin:0 0 .85rem}

.dream-actions {margin-top:.9rem}
.dream-prompts {padding-left:1.25rem;margin-bottom:0}
.dream-prompts li + li {margin-top:.35rem}
.dream-entry p {margin:.35rem 0 0;overflow-wrap:anywhere}

.worked-examples details {border-top:1px solid var(--line)}
.worked-examples summary {cursor:pointer;padding:.7rem 0;color:var(--gold);font-weight:600}
.worked-examples details > div {padding:.25rem .1rem .85rem}

.edition-face.d-woodland {--card-edge:#d1bb73;--card-label:#242e17;background:#323a22}
.edition-face.d-spirit-animal {--card-edge:#ddba79;--card-label:#232939;background:#222637}
.edition-face.d-tides {--card-edge:#b8e1e4;--card-label:#142f48;background:#203955}
.edition-face:is(.d-woodland,.d-tides):not(.edition-back) > .edition-image {
  inset:9% 4% auto;width:92%;height:auto;aspect-ratio:1;
}

.lunar-toolbar {margin:.75rem 0}
.lunar-toolbar strong {text-align:center;flex:1}
.lunar-grid {display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.lunar-grid button {
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.12rem;min-height:2.55rem;
  color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:7px;cursor:pointer;
}
.lunar-grid button span {font-size:clamp(.82rem,4vw,1.2rem)}
.lunar-grid button small {font-size:.66rem}
.lunar-grid button[aria-current=date] {color:var(--gold)}
.lunar-grid button[aria-pressed=true] {border-color:var(--gold);background:var(--panel2)}
.lunar-selected {margin-top:.9rem;padding-top:.8rem;border-top:1px solid var(--line)}

.custom-spread-actions {margin:0 0 .7rem}
.custom-spread-form {border-top:1px solid var(--line);margin-top:.8rem;padding-top:.85rem}
.custom-spread-form fieldset {border:1px solid var(--line);border-radius:12px;margin:.65rem 0;padding:.65rem}
.custom-spread-form fieldset[hidden] {display:none}
.custom-spread-form legend {color:var(--gold);padding:0 .35rem}
.custom-spread-form > .row {margin-top:.85rem}

.cycle-arithmetic summary {cursor:pointer;color:var(--gold);font-weight:600}
.cycle-arithmetic dl {margin-top:.65rem}

.edition-face.d-fairytale {--card-edge:#dfbc8b;--card-label:#45252b;background:#312529}
.edition-face.d-fairytale:not(.edition-back) > .edition-image {
  inset:9% 4% auto;width:92%;height:auto;aspect-ratio:1;
}

.hex-study > summary,.hex-cast-detail > summary {font-weight:700;color:var(--gold);cursor:pointer}
.hex-study > p {margin-top:.6rem}
.hex-study-lines {margin:.7rem 0}
.hex-study-lines .btn[aria-pressed=true] {color:var(--gold);border-color:var(--gold)}
.hex-study-pair {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;margin:.7rem 0}
.hex-study-figure {text-align:center;border:1px solid var(--line);border-radius:10px;padding:.6rem;min-width:0}
.hex-study-figure h4 {margin:.1rem 0 .55rem}
.hex-study-figure .hexlines {width:min(80%,7rem)}
.hex-study-figure .hl {height:.42rem;gap:.55rem}

.companion-touch {position:absolute;inset:0;display:grid;place-items:center;border:0;background:none;cursor:pointer;padding:0}
.companion-touch:focus-visible {outline:2px solid var(--gold);outline-offset:-4px}
.companion-stage .animal-portrait {position:relative;width:76%;z-index:1;border:1px solid #f5d59b;box-shadow:0 .45rem 1rem #110c1a7a}
.companion-light {position:absolute;inset:7%;border:1px solid #f8daa478;border-radius:50%;box-shadow:0 0 1.25rem var(--scene-light);opacity:.55}
.companion-mote {position:absolute;left:13%;top:28%;width:.3rem;height:.3rem;border-radius:50%;background:#ffdda3;box-shadow:0 0 .6rem var(--scene-light);z-index:2}
.companion-mote.second {left:auto;right:10%;top:auto;bottom:26%;width:.2rem;height:.2rem}
.companion-actions {margin-block:.5rem}
.reading-animal-scene:empty {display:none}
.animal-companion.reading-companion {display:block;width:6.5rem;margin-top:.65rem}
@media(max-width:475px){.animal-companion:not(.reading-companion){grid-template-columns:1fr}.companion-stage{max-width:10rem;margin-inline:auto}}
@media(prefers-reduced-motion:no-preference){
  .animal-companion:not(.quiet) .companion-stage[data-motion=true][data-reaction=idle] .animal-portrait {animation:companion-motion var(--animal-tempo,5s) ease-in-out infinite}
  .animal-companion:not(.quiet) .companion-stage[data-motion=true] .companion-mote {animation:companion-drift 4s ease-in-out infinite}
  .animal-companion:not(.quiet) .companion-stage[data-motion=true] .companion-mote.second {animation-delay:-2s}
  .companion-stage[data-motion=true][data-reaction=greet] .animal-portrait {animation:companion-greet .8s ease-out}
  .companion-stage[data-motion=true][data-reaction=reflect] .animal-portrait {animation:companion-reflect 1.15s ease-in-out}
  .companion-stage[data-motion=true][data-reaction=settle] .animal-portrait {animation:companion-settle 1.4s ease-in-out}
  .companion-stage[data-motion=true][data-reaction=nudge] .animal-portrait {animation:companion-nudge .85s ease-out}
  .companion-stage[data-motion=true]:not([data-reaction=idle]) .companion-light {animation:companion-pulse 1.4s ease-out}
}
@keyframes companion-motion {50% {transform:translate(var(--animal-x,0),var(--animal-y,-.3rem)) rotate(var(--animal-tilt,2deg)) scale(var(--animal-scale,1))}}
@keyframes companion-drift {50% {opacity:.35;transform:translate(.35rem,-.55rem)}}
@keyframes companion-greet {35% {transform:translateY(-.55rem) rotate(var(--animal-tilt,2deg)) scale(1.06)} 70% {transform:translateY(.12rem)}}
@keyframes companion-reflect {48% {transform:rotate(var(--animal-tilt,2deg)) scale(1.09)}}
@keyframes companion-settle {50% {transform:translateY(.3rem) scale(.97);filter:brightness(.87)}}
@keyframes companion-nudge {28% {transform:translateX(.35rem) rotate(5deg)} 56% {transform:translateX(-.18rem) rotate(-3deg)}}
@keyframes companion-pulse {40% {opacity:.95;transform:scale(1.12)}}

window.TM = window.TM || {};
TM.majorsRaw = [
["The Fool","beginnings, innocence, leap of faith, free spirit",
"A brand new chapter is opening and you are being asked to step into it before you feel fully ready. The Fool carries almost nothing and trusts everything. Spontaneity, curiosity and a beginner's mind are your greatest assets right now.",
"Recklessness, hesitation or a leap taken without looking. You may be ignoring obvious warning signs, or you may be so afraid of looking foolish that you refuse to start at all. Slow down enough to check the ground, then move.",
"A fresh, playful connection or a chance to love without a script. For couples, the relationship needs spontaneity and lightness. Do not demand guarantees; offer openness.",
"A new job, a career change or a creative venture that does not fit the old mold. Take the risk that excites you, but keep a small safety net. Entry-level humility will serve you.",
"Begin. You will learn the route by walking it. Trust your instincts and let yourself be a beginner again.",
"The Fool is numbered zero, the number of the infinite and the unformed. In the Fool's Journey he is the soul before incarnation, carrying only a small bag of potential. Many traditions place him outside the sequence entirely, which is why he is sometimes shown unnumbered. The little dog is often read as instinct or conscience, the cliff edge as the threshold between known and unknown. His shadow is naivety; his gift is faith.","yes"],
["The Magician","manifestation, willpower, skill, resourcefulness",
"You have everything you need, and the tools are already on the table. The Magician channels intention into reality: focus, skill and timing line up. This is a powerful moment to act, speak, create and make things happen on purpose.",
"Manipulation, wasted talent or scattered energy. Someone may be pretending to be more than they are, or you may be doubting abilities you really do have. Check whether you are using your skills with integrity.",
"Charm, magnetism and clear communication. A conscious choice to pursue someone, or to deliberately create the relationship you want. Watch for smooth talk without substance.",
"Skilled work, entrepreneurship, sales, and launching projects. You can pitch, build and persuade. Put your plan into action rather than just refining it.",
"Stop waiting for permission. Gather your tools, set a clear intention, and act with focus.",
"The Magician is the first card of the sequence and the principle of conscious will. The infinity symbol above his head and the four suit emblems on his table show mastery over all four elements. One hand points to heaven and one to earth, expressing the Hermetic maxim as above, so below. In Kabbalistic tradition he is Beth, the house, and the planet Mercury, the messenger. His shadow is the con artist; his gift is directed attention.","yes"],
["The High Priestess","intuition, mystery, inner knowing, the subconscious",
"Be still and listen. Answers are arriving as hunches, dreams and quiet knowing rather than facts and arguments. Not everything has been revealed, and that is correct. Guard your secrets and trust the part of you that already knows.",
"Ignoring your intuition, secrets coming to the surface, or confusion because you are looking outside for what only the inside can tell you. Disconnect from noise and reconnect with your own voice.",
"Deep, unspoken connection. Something remains hidden, whether in you or in them. Intimacy grows through silence and patience, not interrogation.",
"Research, study, behind-the-scenes work, and confidential matters. Do not announce your plans yet. Trust your gut about a person or opportunity.",
"Wait, observe and listen. The next step will make itself known if you stop pushing.",
"The High Priestess sits between the black pillar B and white pillar J, said to reference the Temple of Solomon's pillars Boaz and Jachin, with a veil of pomegranates behind her. The crescent moon at her feet and the scroll partly hidden in her robe point to hidden knowledge that is not given to everyone. She is the Gimel path on the Tree of Life, the longest path, joining Tiphareth to Kether. Her shadow is withholding; her gift is deep perception.","maybe"],
["The Empress","abundance, nurturing, fertility, creativity, sensuality",
"Growth, comfort and creative bloom. The Empress is nature in full flower: pleasure, beauty, generosity and the joy of making and tending things. Connect with your body, the earth and the people you care for.",
"Smothering, creative block, neglecting self-care, or dependence on others. You may be giving until empty, or ignoring your own need for rest and pleasure.",
"Affection, devotion, sensuality, and possibly pregnancy or a nurturing phase. Love flourishes when it is warm, physical and generous.",
"Creative work, growing a business, financial abundance, and caring professions. Nurture your projects patiently and they will bear fruit.",
"Slow down, enjoy the process, and take care of what you love. Abundance follows nurturing.",
"The Empress is Daleth, the door, and Venus. She wears a crown of twelve stars, tying her to the zodiac year, and sits among ripe wheat. Her heart-shaped shield carries the Venus symbol. In many readings she is the mother archetype and the living earth. Her shadow is possessiveness; her gift is generous creation.","yes"],
["The Emperor","authority, structure, stability, leadership, discipline",
"Order, boundaries and responsible leadership. The Emperor builds systems that last and protects what he builds. This is a time to take charge, set rules, make a plan and hold a steady line.",
"Rigidity, domination, or a lack of discipline. A controlling authority figure, or your own refusal to take responsibility. Power without compassion becomes tyranny; power without structure becomes chaos.",
"A stable, committed, protective partner, or a relationship that needs clear commitments. May indicate an older or very steady person. Beware control.",
"Management, ownership, building a lasting enterprise, and mastering systems. Take the lead and create a framework for success.",
"Make a plan, set firm boundaries and be the steady adult in the situation.",
"The Emperor is Aries in Golden Dawn tradition, ruled by Mars, and the letter Heh in that system, though some decks swap this with the Star. His throne is carved with rams' heads and he holds an ankh and orb, signs of life and the world. The mountains behind him suggest permanence. His shadow is the tyrant; his gift is protective structure.","yes"],
["The Hierophant","tradition, spiritual wisdom, conformity, teaching, institutions",
"Established knowledge, mentorship and shared ritual. Learn from a teacher, tradition or community that has already walked this road. Rules and ceremonies can bring meaning, belonging and stability.",
"Rebellion against convention, dogma, or questioning what you were taught. Time to find your own beliefs rather than inheriting them. Be wary of blind obedience.",
"Commitment, marriage, shared values, and traditional courtship. Families and cultural expectations may play a role. Alternatively, a need to define your own relationship rules.",
"Formal education, certifications, corporate structure, mentorship, and following proven procedures. Work within the system or learn it before you break it.",
"Seek a mentor or learn the rules first. Honor what has been passed down, then decide what to keep.",
"The Hierophant, historically called the Pope, sits between two pillars with two acolytes before him and crossed keys at his feet, symbols of conscious and subconscious knowledge. He is Vav, the nail or hook, and Taurus. The raised hand gives a blessing. The card originally reflected the medieval Church; in modern reading it is any teacher, school or lineage. His shadow is dogma; his gift is transmitted wisdom.","maybe"],
["The Lovers","love, union, harmony, values-aligned choice",
"A deep connection and a meaningful choice. The Lovers is about alignment: of hearts, of values, and of the parts of yourself. A decision made now defines who you are, so choose from your truth rather than convenience.",
"Disharmony, misalignment, a difficult choice avoided, or temptation. Values and actions may not match. Examine whether you are being honest with yourself and your partner.",
"Soul connection, passionate union, and a relationship built on shared values. Also a major relationship decision. Be authentic and vulnerable.",
"A significant choice between paths, or a partnership that aligns with your values. Collaboration thrives. Choose the option you can stand behind.",
"Choose with your whole heart, and be honest about what you truly value.",
"Despite its romantic reputation, the earlier Marseille version showed a young man choosing between two women, a story of choice rather than only romance. The Waite-Smith version shows Adam and Eve beneath an angel, Raphael, with the Tree of Knowledge and Tree of Life behind them. It is Zayin, the sword, and Gemini, the sign of duality. The deeper lesson is choosing consciously. Its shadow is indecision or temptation; its gift is integrity in love.","yes"],
["The Chariot","willpower, determination, victory, control, momentum",
"Victory through discipline and direction. Two opposing forces pull the chariot, and you must steer them with will rather than force. Focus, ambition and self-mastery carry you over the obstacles.",
"Loss of direction, aggression, or being pulled in opposite ways. You may be pushing without a destination, or letting emotions and ego take the reins. Pause and realign.",
"Drive and pursuit; a relationship moving forward quickly. Or two strong wills tugging against each other. Communication and compromise are required.",
"Promotion, travel for work, hard-won success. Stay disciplined and keep your eyes on the goal. Competition is possible.",
"Pick a destination, rein in your impulses and drive with purpose.",
"The Chariot is Cheth, the fence or enclosure, and Cancer, the protective crab. The charioteer wears a star-studded canopy and has no reins in many decks, steering by will alone. The black and white sphinxes are often read as opposing instincts. It is sometimes tied to the soul as the driver of the body. Its shadow is ruthless ambition; its gift is focused victory.","yes"],
["Strength","courage, patience, compassion, inner power, taming instinct",
"Quiet courage and gentle mastery. Strength here is not force; it is patience, compassion and steady confidence that calms the beast. You can meet fear and anger with kindness and win through softness.",
"Self-doubt, raw emotion, or using force instead of gentleness. You may be suppressing something that needs acknowledgement, or feeling depleted. Rebuild your confidence from the inside.",
"Tenderness, patience and emotional resilience. A relationship that deepens through compassion. Heal through acceptance rather than control.",
"Perseverance, calm leadership under pressure, and handling difficult people with grace. Your steady energy is your edge.",
"Be gentle with yourself and with the difficult thing. Courage is calm, not loud.",
"In the original Waite-Smith deck Strength is numbered VIII and Justice XI. Waite swapped them to match astrological correspondences, while older Marseille decks keep Justice at VIII and Force at XI. A woman closes the lion's mouth with a garland, and an infinity sign floats over her head, linking her to the Magician. She is Teth, the serpent, and Leo. Its shadow is self-doubt; its gift is compassionate courage.","yes"],
["The Hermit","solitude, introspection, wisdom, guidance, searching",
"A time to withdraw and look within. The Hermit holds a lantern lit with hard-won wisdom, lighting only the next few steps. Seek your own truth in stillness; you may also be the teacher for someone else.",
"Isolation, loneliness, or refusing to listen to anyone. You may be withdrawing too much, or avoiding the very reflection you need. Reconnect without losing your center.",
"A pause for reflection. Time alone to understand what you need, or a partner who needs space. A single person may be choosing solitude on purpose.",
"Specialist expertise, research, mentoring and independent work. Step back from the noise to think strategically.",
"Take time alone. Light only the next step and trust that it is enough.",
"The Hermit carries a lantern containing a six-pointed star, the seal of Solomon, and a staff. He is Yod, the hand, the smallest Hebrew letter, and Virgo, the sign of discernment. Alone on a snowy peak he is shown as the one who has already climbed. His shadow is withdrawal; his gift is wisdom shared as light.","maybe"],
["Wheel of Fortune","cycles, destiny, change, luck, turning points",
"The wheel turns. Circumstances shift, luck changes and something larger than your plan is at work. Ride the change, because resisting the turning only makes the ride rougher. A karmic cycle is moving.",
"Bad timing, resistance to change, or feeling stuck in a loop. What goes down must come up, so do not take this phase as permanent. Look at the pattern you keep repeating.",
"Fate-feeling encounters, a relationship at a turning point, or a repeating pattern that is finally breaking. Be adaptable.",
"A change of fortune: a big opportunity, restructuring, or a sudden shift. Stay flexible and seize the lucky break.",
"Accept the cycle. Let go of what is turning downward and prepare for what is rising.",
"The wheel in the Waite-Smith card carries Hebrew letters that spell Tarot, Rota, Torah and the divine name, along with alchemical symbols, and four winged creatures reading books in the corners, the same four figures found on the World card. It is Kaph, the palm of the hand, and Jupiter, the planet of expansion and luck. Its shadow is helplessness; its gift is perspective.","yes"],
["Justice","fairness, truth, cause and effect, law, accountability",
"Truth and consequence. Every action has a reaction, and Justice weighs them without favor. Honest decisions, fair dealing and legal or contractual matters come to a clear resolution.",
"Unfairness, dishonesty, avoiding accountability or a biased verdict. You may be avoiding the truth or being judged unjustly. Examine your own part honestly.",
"Honest, balanced relationships; karmic partnership; clarity about what you are owed and what you owe. A time to be truthful.",
"Contracts, legal issues, ethical decisions, and fair evaluations. Document everything and act with integrity.",
"Tell the truth, weigh it carefully and accept the consequences with grace.",
"Justice holds a sword in one hand and scales in the other, shown seated between two pillars. The sword is the clear mind, the scales are balance. It is Lamed, the ox goad, and Libra. In Waite's deck it is XI; in Marseille and Thoth it is VIII, and the Thoth deck calls it Adjustment. Its shadow is harsh judgement; its gift is honest balance.","maybe"],
["The Hanged Man","surrender, new perspective, pause, sacrifice, letting go",
"Suspension. You are being asked to pause and see from a completely different angle. What looks like delay is a gift of insight. Let go of control and a surprising answer may arrive.",
"Stalling, needless martyrdom, or resisting the pause. You may be sacrificing for no reason or procrastinating on a decision. Decide whether you are waiting wisely or just stuck.",
"A pause in the relationship, surrendering expectations, or a sacrifice for love. See your partner differently. Do not martyr yourself.",
"Projects on hold, a need to rethink your approach, or being passed over. Use the wait to reconsider. A different angle solves the problem.",
"Stop pushing. Hang for a while, look at it upside down and let go of the old way.",
"The Hanged Man hangs by one foot from a living tree with a calm face and a halo, so he has chosen this. He is Mem, water, and in older systems linked to Neptune or the element of water. A related older image, the traitor hanged upside-down, appears in medieval Italian cards. In some readings he echoes the myth of Odin hanging on the world tree to win the runes. His shadow is martyrdom; his gift is enlightened surrender.","no"],
["Death","endings, transformation, transition, release, renewal",
"A necessary ending and a new beginning. Death is rarely literal; it is the closing of a chapter that has finished. Release what is finished and let transformation happen. This is deep change, and it is ultimately renewal.",
"Resisting change, clinging to what is over, or a slow, stagnant ending. Fear of loss is keeping you in limbo. The transformation will come with or without your cooperation.",
"The end of a relationship phase and a deep reset. Old patterns die so a more honest connection can form. Alternatively, clinging to something that is already gone.",
"A job ending, restructuring, or a total change of career. Let go of the old role. Rebuild on stronger ground.",
"Let it end. Make room, grieve what you must, and prepare for renewal.",
"Death is Nun, the fish, and Scorpio, the sign of transformation. In the Waite-Smith card a skeleton knight carries a black flag with a white rose, the symbol of purity, while a rising sun in the background hints at rebirth. Bishop, king, maiden and child all face him, because death is the great equalizer. Its shadow is resisting change; its gift is rebirth.","no"],
["Temperance","balance, moderation, patience, alchemy, healing",
"Blend, balance and patience. Temperance mixes opposites into something new, pouring water between two cups. Take the middle path, practice moderation and trust the slow process of healing and integration.",
"Imbalance, excess, impatience or conflict of interests. You may be overdoing something or forcing a result. Return to measure and rhythm.",
"Harmony, compatible energies, and a relationship blending two lives gradually. Patience and compromise bring peace.",
"Collaboration, steady progress, and finding the right mix of work and rest. Avoid extremes and let things develop.",
"Moderate, blend, and be patient. The right proportion will reveal itself.",
"Temperance's angel stands with one foot on land and one in water, pouring liquid between cups, a picture of the conscious and subconscious flowing together. It is Samekh, the support or prop, and Sagittarius. Behind her a path leads to a crown-topped mountain. Its shadow is excess or imbalance; its gift is alchemical integration.","yes"],
["The Devil","bondage, shadow self, temptation, addiction, materialism",
"The chains are loose. The Devil shows how you are bound by desire, fear, habit or unhealthy attachments, often by choice. Look honestly at what has a hold on you and recognize that you can take the chains off.",
"Breaking free, reclaiming power, and facing the shadow. A pattern or addiction begins to lose its grip, though old temptations may flare. Seek support if needed.",
"Intense attraction that can drift into obsession, control or dependency. Also a chance to see unhealthy patterns clearly. Honesty and boundaries help.",
"Golden handcuffs, toxic workplaces, workaholism, and money fixation. Ask whether the job owns you.",
"Name what you feel trapped by. Remember the chains are looser than you think.",
"The Devil is Ayin, the eye, and Capricorn, the goat. The imagery is a darker mirror of the Lovers: the man and woman are chained, but loosely, and they even have horns and tails like the figure above. The inverted pentagram on the figure's brow signals matter over spirit. Many readers see this card as the shadow in the psychological sense. Its shadow is bondage; its gift is liberation through honesty.","no"],
["The Tower","upheaval, sudden change, revelation, breakdown, awakening",
"A sudden collapse of something built on a shaky foundation. The Tower is a shock, but also a revelation, because false structures fall so the truth can stand. Let it go, and use the clear ground to rebuild better.",
"Avoiding disaster, delaying inevitable change, or surviving a calamity. Fear of change keeps you clinging to cracked walls. The collapse may be slower or internal.",
"A shocking truth or breakup that clears the air. Relationships based on illusion cannot hold. Rebuild with honesty.",
"Layoffs, sudden restructuring, or a project collapsing. Painful but freeing. Do not rebuild the same weak structure.",
"Let the false thing fall. Stay safe, stay honest, and rebuild on truth.",
"The Tower is Peh, the mouth, and Mars. A bolt of lightning strikes the crown from the tower, and figures fall from its windows, a picture of the ego's structures being shattered. Some read it as the Tower of Babel. In older Marseille decks it is called the House of God. Its shadow is destruction; its gift is liberation and truth.","no"],
["The Star","hope, healing, inspiration, renewal, serenity",
"Hope after the storm. The Star brings calm, healing and faith in the future. Pour yourself out, trust, and let inspiration return. You are being restored and guided.",
"Discouragement, lost faith or disconnection from your purpose. You may be doubting that things will improve. Small acts of self-care rebuild hope.",
"Healing, renewed openness and a gentle, honest connection. Love after hurt. Trust again slowly and sincerely.",
"Inspired goals, long-term vision and recovering from setbacks. A good time to design your future and share your gifts.",
"Rest, heal and have faith. Keep pouring out your light.",
"The Star shows a nude woman kneeling at a pool, pouring water onto land and into the pool, beneath a large eight-pointed star surrounded by seven smaller ones. She is Tzaddi, the fish hook, and Aquarius, though some systems swap this with the Emperor. Its shadow is despair; its gift is renewal.","yes"],
["The Moon","illusion, intuition, fear, dreams, uncertainty",
"Things are not as they appear. The Moon lights a winding path at night, full of dream, doubt and shadow. Trust your intuition but do not trust every fear. Wait for clarity before deciding.",
"Confusion clearing, secrets revealed, or release of fear. You are starting to see what was hidden, though anxiety may linger. Ground yourself in facts.",
"Mixed signals, hidden feelings or insecurity. Pay attention to what is unspoken and avoid projecting fears onto your partner.",
"Unclear information, hidden agendas and uncertainty. Move carefully, verify details and avoid big commitments until the picture clears.",
"Do not decide in the dark. Wait for daylight, check the facts and pay attention to your dreams.",
"The Moon shows a dog, a wolf and a crayfish rising from a pool toward a long path between two towers, with a moon of sixteen rays above. It is Qoph, the back of the head, and Pisces. The animals are often read as the tame and wild parts of the psyche. Its shadow is illusion; its gift is imagination and intuition.","maybe"],
["The Sun","joy, success, vitality, clarity, optimism",
"Pure joy and success. The Sun floods everything with warmth, truth and vitality. Good news, clear success, and a sense of being fully alive. Enjoy it. Be visible and let yourself shine.",
"Temporary clouds, delayed success or dimmed enthusiasm. Even reversed, the Sun is still shining. You may be too ego-driven or doubting your own joy.",
"Warmth, happiness, and a thriving, open relationship. Possibly children or a joyful celebration. Honest affection.",
"Recognition, thriving, successful projects and enthusiasm. Share your results and keep going.",
"Step into the light. Celebrate, be honest and enjoy what is working.",
"The Sun is Resh, the head, and of course the Sun itself. A child rides a white horse beneath sunflowers, naked and unashamed, the picture of innocence restored. In Golden Dawn lore the Sun is the glory of the self after the long night. Its shadow is arrogance; its gift is joy.","yes"],
["Judgement","reckoning, awakening, rebirth, calling, absolution",
"A calling and a reckoning. Judgement asks you to rise, forgive and answer a higher call. You are evaluating the past with honesty and being invited to a new, truer life.",
"Self-doubt, ignoring the call or harsh self-criticism. You may be refusing to learn the lesson or to forgive. Let go of the old story.",
"A relationship being re-evaluated and renewed. Forgive, and call in an honest chapter. Possible reunion.",
"A turning point, career calling, or review. Use feedback to move forward. Answer your vocation.",
"Listen to the call. Forgive yourself and others, then step into who you are becoming.",
"The angel Gabriel blows a trumpet over figures rising from coffins, a depiction of the Last Judgement. It is Shin, the tooth and the letter of fire, linked in the Golden Dawn to the element of fire and, in modern decks, to Pluto. The card is about awakening more than punishment. Its shadow is condemnation; its gift is rebirth and purpose.","yes"],
["The World","completion, wholeness, accomplishment, integration, travel",
"Completion and wholeness. A cycle has finished with success, and you stand in your full self. Celebrate, integrate what you have learned, and know that a larger journey is about to begin.",
"Unfinished business, delay in completion or a missing final step. You are close, but something remains to be tied up. Finish what you started.",
"Fulfillment, a complete relationship and a sense of belonging. Marriage, union or a cycle closing happily.",
"Completion of a major project, global opportunities and mastery. Celebrate achievements before starting anew.",
"Finish the last step, celebrate, and prepare for the next spiral.",
"The World shows a dancer within a laurel wreath, holding two wands, with the four living creatures of Ezekiel in the corners: man, eagle, bull and lion, associated with Aquarius, Scorpio, Taurus and Leo. It is Tav, the cross or mark, and Saturn. The sequence returns to the Fool, because the end of a cycle is also a doorway. Its shadow is stagnation; its gift is wholeness.","yes"]
];

"A surge of creative fire and raw potential. An idea, opportunity or burst of energy arrives and asks to be acted on. The seed of a passion project or bold new direction.",
"A delay, a false start, or a spark that fizzles. Creative block, lack of motivation, or an idea that is not ready. Find what actually excites you.",
"Passion ignites. A new attraction or a renewed spark in an existing relationship. Be bold, but let it grow.",
"A new venture, job offer or creative project with real energy behind it. Start while the fire is hot.",
"Act on the idea now, even in a small way."],
["planning, decisions, discovery, future vision",
"You hold the world in your hands and must choose a direction. A time of planning, leaving the comfort zone and looking at the larger picture before committing.",
"Fear of the unknown, indecision or a plan going nowhere. Playing small, or leaving your plans on paper. Choose and take one step.",
"A decision about where a relationship is heading, or a wish to expand your horizons. Do not stay with the safe option just because it is safe.",
"Weighing a major career choice, expansion or relocation. Research, then commit to a plan.",
"Decide where you are going, and take the first step beyond what you know."],
["expansion, foresight, progress, trade, first results",

"Delays, obstacles to growth or poor planning. Ships arrive late. Re-check your plans and be patient, or review who you rely on.",
"A relationship expanding, perhaps across distance or into new territory. Long-distance love. Look beyond the immediate.",
"Business expansion, international work and early success. Check your supply chain and keep building.",
"Keep your eye on the horizon and trust that your efforts are traveling toward you."],
["celebration, harmony, homecoming, stability, milestones",

"Instability at home, canceled celebrations or a lack of support. A milestone that feels hollow or delayed. Check the foundation.",
"Engagement, moving in together, family happiness and harmony. A relationship that feels like home.",
"A project success, team celebration or stable workplace. Share credit and savor the win.",
"Celebrate the win with the people who helped make it."],
["conflict, competition, tension, disagreement, rivalry",

"Avoiding conflict, tension easing, or a truce. Disagreements can be settled if you stop fighting for its own sake. Or hidden resentments are building.",
"Arguments, mixed expectations or a need for the relationship to find a way to cooperate. Play fair, and do not escalate.",
"Competitive workplace, clashing ideas or turf wars. Use friction productively and find common goals.",

["victory, recognition, triumph, public success, confidence",

"Delayed recognition, self-doubt or pride before a fall. Success credited to others, or the win is hollow. Do not seek praise as the only reward.",
"A confident, admired partner or a relationship victory. Proud moments together. Do not let ego take over.",
"Promotion, award or successful presentation. Your reputation is rising, so be gracious.",
"Accept the praise, then plan the next step."],
["defense, perseverance, standing your ground, challenge",

"Exhaustion, giving in, or defensiveness. You may be overwhelmed or fighting the wrong battles. Rest, then reassess.",
"Defending the relationship, standing up for your needs or facing outside criticism. Do not be defensive with your partner.",
"Competition, criticism and the need to defend your work. Know your value and keep your position.",
"Hold your ground on what you believe, and choose your battles."],
["speed, movement, messages, quick action, travel",
"Fast movement. News arrives, travel begins, and things speed up. Act quickly, communicate fast and ride the momentum.",
"Delays, scattered energy or messages crossed. Rushing leads to mistakes. Slow down, check details, and do not burn out.",
"Quick developments, flirtation, sudden messages or a fast-moving romance. Make sure you want the speed.",
"Quick deadlines, rapid progress and travel for work. Respond promptly and keep communication clear.",
"Move swiftly now, and double-check what you send."],
["resilience, persistence, last stand, boundaries, courage",
"You are bruised but still standing. One last push remains, and your resilience has already proven itself. Stay on guard and finish strong. Do not give up now.",
"Burnout, paranoia or stubbornness. You may be refusing help or defending against everyone. Rest, and drop unnecessary armor.",
"Wariness after past hurt, or the work of building trust. Do not shut out the person who is trying to help.",
"Fatigue near the finish line. Take stock, keep your guard, and see the project through.",
"You are nearly there. Rest, then take the last step."],
["burden, responsibility, overload, hard work, stress",
"You are carrying too much, though the destination is close. Responsibility and hard work weigh on you. Consider what you can set down or delegate.",
"Releasing the burden, delegating, or collapsing under it. You are learning to put down what is not yours to carry.",
"Taking on too much in a relationship, or one partner doing all the emotional labor. Share the load.",
"Overwork, too many projects and management stress. Prioritize and ask for help.",
"Put down what is not yours, and ask for a hand with the rest."],
["enthusiasm, exploration, discovery, free spirit, messenger",

"Immaturity, scattered ideas or bad news. A flaky person or a project that lacks follow-through. Direct the enthusiasm.",
"Playful flirtation, a spirited new person, or a fun message. Keep it light and honest.",
"A new creative opportunity, apprenticeship or exciting pitch. Experiment boldly.",
"Try something new, and stay curious."],
["energy, adventure, impulsiveness, passion, charm",
"Dashing, passionate and on the move. Bold action, adventure and charisma. Chase what excites you, though impulsiveness can scorch.",
"Recklessness, haste or burnout. Anger, restlessness or a lover who is all talk. Aim the fire before you fire it.",
"A passionate, exciting, perhaps inconsistent lover. Fireworks, but check for follow-through.",
"A bold career push, ambitious start, or risky project. Pair momentum with a plan.",
"Go for it, but think before you charge."],
["confidence, warmth, determination, independence, vibrant leader",
"Magnetic, warm and decisive. A confident person who inspires others and makes things happen. Be fully yourself and lead by example.",
"Jealousy, temper or insecurity hiding behind bravado. Demanding attention or feeling overshadowed. Reclaim your confidence calmly.",
"A passionate, loyal and charismatic partner. Open and affectionate, though can be possessive.",
"Leadership, running your own show, and attracting supporters. Own your vision and be a role model.",
"Lead with warmth and own your fire."],
["vision, leadership, entrepreneurship, honor, big-picture",
"A visionary leader with authority and charisma. The King of Wands turns ideas into movement and inspires people. Take bold leadership and think long-term.",
"Domineering, impatient or all vision with no follow-through. An arrogant boss, or you are holding back your leadership. Listen as well as lead.",
"A confident, generous, passionate partner who may need to share the spotlight.",
"Founders, executives and bold decision-makers. Take charge of the vision and delegate details.",
"Lead with vision, and let others help build it."]
];
TM.minorsRaw.cups = [
["new feelings, love, intuition, emotional beginning, overflowing",
"A new wave of emotion: love, compassion, creativity or spiritual opening. Your heart is full, and something beautiful may begin. Open yourself to it.",
"Blocked or repressed feelings, an emotional drought, or an offer you cannot accept. Do not ignore your inner life.",
"A new romance, a deepening of love or a self-love breakthrough. Say yes to openness.",
"Work that nourishes your heart; a rewarding creative or caring opportunity.",
"Let yourself feel it, and let the feeling guide you."],
["partnership, attraction, connection, mutual respect, union",
"Two hearts meeting in mutual respect and attraction. A balanced partnership, whether romantic, business or friendship. Honest exchange.",
"A disconnect, imbalance or breakup. Mismatched effort or miscommunication. Rebalance or release.",
"Mutual attraction, soulmate energy, a committed pairing. Equal give and take.",
"A good partnership or collaboration. Trust and shared goals.",
"Reach out, meet halfway and give as much as you receive."],
["friendship, celebration, community, joy, support",
"Joy shared with friends. A celebration, a reunion or the comfort of a supportive circle. Connection and festivity.",
"Gossip, overindulgence or a third wheel. Social burnout, isolation or cliques. Choose who you celebrate with.",
"Friendships blossoming into love, social events, or a shared celebration. Enjoy the group.",
"Team success, a friendly workplace or networking. Celebrate wins together.",
"Gather your people and celebrate."],
["apathy, contemplation, reevaluation, missed opportunity, boredom",

"Awakening from apathy, noticing a new offer, or re-engagement. Motivation returns. Or deepening withdrawal.",
"Dissatisfaction, taking a partner for granted, or ignoring someone's overtures. Look at what is being offered.",
"Boredom at work and not seeing opportunities. Reconsider what you actually want.",
"Look up. Something is being offered while you stare at what is missing."],
["loss, grief, regret, disappointment, looking back",

"Moving on, acceptance and forgiveness. You are starting to pick up the remaining cups. Or stuck in grief and denial.",
"A heartbreak or disappointment. Healing comes when you accept it and notice who remains.",
"Setback or disappointment in work. Learn from it and consider what is salvageable.",
"Grieve fully, then pick up what remains."],
["nostalgia, childhood, innocence, reunion, kindness",
"Sweet memories, kindness and the comfort of the familiar. A reunion, a gift, or reconnecting with your inner child. Innocent joy.",
"Stuck in the past, unrealistic nostalgia, or immaturity. Let go of an old story to be present.",
"An old flame, childhood sweetheart or tender, gentle love. Be careful not to idealize the past.",
"Working with family or old colleagues, or reviving an old skill. Gentle, supportive environment.",
"Revisit the past gently, then bring its sweetness into the present."],
["choices, illusions, fantasy, wishful thinking, options",

"Idealized love, mixed possibilities or a fantasy partner. Face reality before committing.",
"Too many ideas, projects or offers. Pick the one that matches your values and focus.",
"Choose carefully and test the fantasy against reality."],
["walking away, disillusionment, seeking meaning, leaving behind",
"You leave something behind because it no longer satisfies you. A deliberate journey in search of deeper meaning. Walking away is courage here.",
"Fear of leaving, drifting aimlessly, or returning to what you abandoned. Avoiding a necessary exit or running away from yourself.",
"Leaving a situation that no longer feeds you, or searching for deeper connection. Do not settle.",
"Quitting a job that has lost meaning, or a shift to more fulfilling work. Honor what you have outgrown.",
"Leave what no longer feeds you, and go toward meaning."],
["wishes granted, contentment, satisfaction, gratitude, the wish card",
"The wish card. Contentment and emotional fulfillment. What you hoped for is arriving, so enjoy it and be grateful. Comfort and satisfaction.",
"Smugness, dissatisfaction despite having everything, or an unfulfilled wish. Check whether you are chasing the wrong wish.",
"Emotional and physical satisfaction, a happy relationship and shared enjoyment.",
"Satisfaction in your work, a reward and recognition of effort.",

// Name of a card under a given deck tradition
TM.cardName = function(card, deckId){
  var dk = TM.decks[deckId||"classic"];
  if(card.type==="major"){
    if(deckId==="thoth") return TM.thothMajors[card.i];
    if(deckId==="marseille") return TM.marseilleMajors[card.i];
    return card.name;
  }
  var rn = card.rank<=10 ? TM.rankInfo[card.rank].n : dk.courts[card.rank];
  if(deckId==="marseille"){
    var cn = {11:"Valet",12:"Cavalier",13:"Reine",14:"Roi"};
    var num = card.rank<=10 ? (card.rank===1?"As":TM.rankInfo[card.rank].n) : cn[card.rank];
    var fr = {Two:"Deux",Three:"Trois",Four:"Quatre",Five:"Cinq",Six:"Six",Seven:"Sept",Eight:"Huit",Nine:"Neuf",Ten:"Dix",As:"As"};
    var nm2 = fr[num]||num;
    return nm2+" de "+dk.suitNames[card.suit];
  }
  return rn+" of "+dk.suitNames[card.suit];
};
TM.cardTitle = function(card, deckId){ // extra Thoth title
  if(deckId==="thoth" && card.type==="minor" && card.rank>=2 && card.rank<=10) return TM.thothTitles[card.suit][card.rank-2];
  return "";
};
TM.cardNumeral = function(card, deckId){
  if(card.type==="major"){
    if(deckId==="thoth"||deckId==="marseille"){
      if(card.i===8) return "XI"; if(card.i===11) return "VIII";
    }
    if(deckId==="marseille" && card.i===13) return "XIII";
    return card.roman;
  }
  return card.roman;
};
