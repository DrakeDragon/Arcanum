  H.playingCard=function(t){var card=cards[Number(t.dataset.i)]; if(card) showCard(card);};
})();

/* European geomantic shield chart with Arcanum reflection prompts. */
(function(){
  var H=A.handlers, esc=A.esc, tab="cast", rows=[], step=0;
  var figures=[
    ["Populus","The People","Which opinions around you are shaping your own?"],
    ["Tristitia","Sorrow","What needs time and attention before you can move forward?"],
    ["Albus","White","What becomes clearer if you slow down and observe?"],
    ["Fortuna Major","Greater Fortune","What reliable support can you build on?"],
    ["Rubeus","Red","Where might a strong reaction be directing your attention?"],
    ["Acquisitio","Gain","What would be worth taking on, and what would it cost?"],
    ["Conjunctio","Meeting","Which two people, ideas, or tasks would benefit from meeting?"],
    ["Caput Draconis","Dragon’s Head","What small beginning would open up a new possibility?"],
    ["Laetitia","Joy","What is already giving you energy that you can make room for?"],
    ["Carcer","Enclosure","Which boundary protects you, and which one keeps you stuck?"],
    ["Amissio","Loss","What can you set down to make room for something else?"],
    ["Puella","Girl","Where could care or tact change the conversation?"],
    ["Fortuna Minor","Lesser Fortune","What could you try while a short-lived opportunity is available?"],
    ["Puer","Boy","Where would a small deliberate action be more helpful than a rush?"],
    ["Cauda Draconis","Dragon’s Tail","What deserves a deliberate ending?"],
    ["Via","The Way","What changes if you focus on the next step you can see?"]
  ];
  var example=[8,3,6,11];
  var groups=[
    ["Mothers","Read each block of four cast rows from top to bottom.",["Mother 1","Mother 2","Mother 3","Mother 4"]],
    ["Daughters","Read across the Mothers in numbered order. Their top rows make Daughter 1, their second rows make Daughter 2, and so on.",["Daughter 1","Daughter 2","Daughter 3","Daughter 4"]],
    ["Nieces","Combine Mothers 1 and 2, then Mothers 3 and 4. Repeat with the Daughters. A row gets one dot when its two inputs differ and two when they match.",["Niece 1","Niece 2","Niece 3","Niece 4"]],
    ["Witnesses","Combine Nieces 1 and 2 for the Right Witness, then Nieces 3 and 4 for the Left Witness.",["Right Witness","Left Witness"]],
    ["Judge and Reconciler","Combine the Witnesses for the Judge. Combine the Judge and Mother 1 for the optional Reconciler.",["Judge","Reconciler"]]
  ];

  function chart(mothers){
    var daughters=[3,2,1,0].map(function(bit){
      return mothers.reduce(function(figure,mother){return (figure<<1)|((mother>>bit)&1);},0);
    });
    var nieces=[mothers[0]^mothers[1],mothers[2]^mothers[3],daughters[0]^daughters[1],daughters[2]^daughters[3]];
    var witnesses=[nieces[0]^nieces[1],nieces[2]^nieces[3]];
    var judge=witnesses[0]^witnesses[1];
    return [mothers,daughters,nieces,witnesses,[judge,judge^mothers[0]]];
  }
  function dotCounts(id){
    return [8,4,2,1].map(function(mask){return id&mask?1:2;});
  }
  function glyph(counts){
    return '<span class="geo-glyph" aria-hidden="true">'+counts.map(function(count){
      return '<span>'+('<i></i>').repeat(count)+'</span>';
    }).join("")+'</span>';
  }
  function tile(id,label){
    var name=figures[id][0];
    return '<button class="geo-tile" data-a="geoFigure" data-id="'+id+'" aria-label="'+
      esc(label?label+", "+name:name)+'">'+(label?'<span class="small muted">'+esc(label)+'</span>':"")+
      glyph(dotCounts(id))+'<strong>'+esc(name)+'</strong></button>';
  }
  function group(values,index){
    var info=groups[index];
    return '<section class="geo-tier"><h3>'+info[0]+'</h3><div class="geo-grid">'+values.map(function(id,i){
      return tile(id,info[2][i]);
    }).join("")+'</div></section>';
  }
  function cast(){
    var done=rows.length===16;
    var controls='<div class="row geo-controls"><button class="btn small" data-a="geoMark" data-count="1"'+(done?" disabled":"")+'>Odd · 1 dot</button>'+
      '<button class="btn small" data-a="geoMark" data-count="2"'+(done?" disabled":"")+'>Even · 2 dots</button>'+
      '<button class="btn ghost small" data-a="geoUndo"'+(!rows.length?" disabled":"")+'>Undo row</button>'+
      (!rows.length?'<button class="btn ghost small" data-a="geoRandom">Cast automatically</button>':
        '<button class="btn ghost small" data-a="geoReset">Start over</button>')+'</div>';
    var entry='<section class="panel"><h2>Cast a shield chart</h2><p>Think of an open-ended question. To cast by hand, make rows of marks on paper. Enter Odd or Even for the number of marks in each row.</p>'+
      '<p id="geo-progress" class="gold" tabindex="-1" role="status">'+(done?"All 16 rows entered":"Mother "+(Math.floor(rows.length/4)+1)+" · Row "+(rows.length%4+1)+" of 4")+
      '</p>'+controls+'<ol class="geo-seed" aria-label="Cast rows">'+rows.map(function(count){
        return '<li><span class="geo-visually-hidden">'+(count===1?"Odd":"Even")+'</span>'+glyph([count])+'</li>';
      }).join("")+'</ol></section>';
    if(!done) return entry;
    var result=chart([0,4,8,12].map(function(i){
      return rows.slice(i,i+4).reduce(function(figure,count){return (figure<<1)|(count===1?1:0);},0);
    }));
    var judge=figures[result[4][0]], reconciler=figures[result[4][1]];
    return entry+'<section class="panel"><h2>Your shield chart</h2>'+result.map(group).join("")+
      '<h3>Reflect on the Judge</h3><p><strong>'+esc(judge[0])+' · </strong>'+esc(judge[2])+
      '</p><h3>Bring it back to your question</h3><p><strong>'+esc(reconciler[0])+' · </strong>'+esc(reconciler[2])+
      '</p>'+A.sayBtn("Judge. "+judge[0]+". "+judge[2]+" Reconciler. "+reconciler[0]+". "+reconciler[2],"Geomancy reflection")+'</section>';
  }
  function lesson(){
    var result=chart(example);
    return '<section class="panel"><h2>Follow a worked cast</h2><p>Start with the question “What could help me restart a creative project?” Follow the same four Mothers through each stage.</p>'+
      '<p id="geo-step" class="gold" tabindex="-1">Step '+(step+1)+' of '+groups.length+'</p><p>'+groups[step][1]+'</p>'+
      result.slice(0,step+1).map(group).join("")+
      (step===4?'<p>Via, the Judge, suggests working with the next step you can see. Caput Draconis, the Reconciler, asks what small beginning would open up a possibility. You might reopen the project and spend twenty minutes making one rough sketch. Choose a different first step and name the figure that helped you choose it.</p>':"")+
      '<div class="row geo-controls"><button class="btn ghost small" data-a="geoStep" data-offset="-1"'+(!step?" disabled":"")+'>Previous step</button>'+
      '<button class="btn small" data-a="geoStep" data-offset="1"'+(step===4?" disabled":"")+'>Next step</button></div>'+
      '<p class="small muted">For the historical background, see <a href="https://www.princeton.edu/~ezb/geomancy/agrippa.html" target="_blank" rel="noopener noreferrer"><cite>Of Geomancy</cite> (1655)</a>. The reflection prompts are written for Arcanum.</p></section>';
  }
  function refresh(selector){
    A.render();
    var control=A.$(selector);
    if(control) control.focus({preventScroll:true});
  }
  A.geomancyView=function(){
    return '<div class="seg" role="group" aria-label="Geomancy views">'+[["cast","Cast"],["library","Figure Library"],["learn","Learn"]].map(function(item){
      return '<button class="'+(tab===item[0]?"on":"")+'" data-a="geoTab" data-tab="'+item[0]+'" aria-pressed="'+(tab===item[0])+'">'+item[1]+'</button>';
    }).join("")+'</div>'+A.sectionIntro("geomancy",tab)+(tab==="cast"?cast():tab==="learn"?lesson():
      '<section class="panel"><h2>The 16 figures</h2><div class="geo-grid">'+figures.map(function(_,i){return tile(i);}).join("")+'</div></section>');
  };
  H.geoTab=function(t){
    if(!["cast","library","learn"].includes(t.dataset.tab)) return;
    tab=t.dataset.tab;
    refresh('[data-a="geoTab"][data-tab="'+tab+'"]');
  };
  H.geoFigure=function(t){
    var id=Number(t.dataset.id), figure=figures[id];
    if(!figure) return;
    var counts=dotCounts(id), description="Dots from top to bottom: "+counts.join(", ")+".";
    A.openSheet('<div class="geo-detail">'+glyph(counts)+'</div><h2>'+esc(figure[0])+'</h2><p>'+esc(figure[1])+'</p><p>'+
      description+'</p><h3>Reflect</h3><p>'+esc(figure[2])+'</p>'+
      A.sayBtn(figure[0]+". "+figure[1]+". "+description+" "+figure[2],figure[0]),"Geomancy");
  };
  H.geoMark=function(t){
    var count=Number(t.dataset.count);
    if(rows.length===16||(count!==1&&count!==2)) return;
    rows.push(count);
    refresh(rows.length===16?"#geo-progress":'[data-a="geoMark"][data-count="'+count+'"]');
  };
  H.geoUndo=function(){
    if(!rows.length) return;
    rows.pop();
    refresh(rows.length?'[data-a="geoUndo"]':'[data-a="geoMark"]');
  };
  H.geoReset=function(){rows=[]; refresh('[data-a="geoMark"]');};
  H.geoRandom=function(){
    if(rows.length) return;
    rows=Array.from({length:16},function(){return Math.random()<0.5?1:2;});
    refresh("#geo-progress");
  };
  H.geoStep=function(t){
    var offset=Number(t.dataset.offset);
    if(offset!==-1&&offset!==1) return;
    step=Math.max(0,Math.min(groups.length-1,step+offset));
    refresh("#geo-step");
  };
})();

// ---------- angel numbers ----------
function analyzeAngel(s){
  s=String(s).replace(/\D/g,""); if(!s) return null;
  var known=TM.angel.known[s]; var parts=[];
  if(known) parts.push(known);
  var digits=s.split("").map(Number), uniq=[], seen={};
  digits.forEach(function(d){ if(!seen[d]){seen[d]=1;uniq.push(d);} });
  var allSame = uniq.length===1 && s.length>1;
  var asc=true,desc=true; for(var i=1;i<digits.length;i++){ if(digits[i]!==digits[i-1]+1) asc=false; if(digits[i]!==digits[i-1]-1) desc=false; }
  var pal = s.length>2 && s===s.split("").reverse().join("") && !allSame;
  if(!known){
    if(allSame) parts.push("A repeating number amplifies its digit. Seeing "+s+" is read as the energy of "+digits[0]+" being turned all the way up. "+TM.angel.digit[digits[0]]);
    else {
      parts.push("Read digit by digit: "+uniq.map(function(d){return TM.angel.digit[d];}).join(" "));
    }
  }
  if(!allSame && s.length>2 && asc) parts.push("The digits climb in sequence, which is read as steady progress and moving up a level.");
  if(!allSame && s.length>2 && desc) parts.push("The digits descend in sequence, which is read as releasing, winding down or returning to basics.");
  if(pal) parts.push("This number reads the same forwards and backwards, a mirror number, which is read as balance and reflection.");
  var sum=digits.reduce(function(a,b){return a+b;},0), r=TM.num.reduce(sum), N=TM.N[r.v];
  if(s.length>1 && N) parts.push("The digits add up to "+sum+(r.v!==sum?", which reduces to "+r.v:"")+". In numerology that is "+N.t.split(" (")[0].toLowerCase()+", with themes of "+N.kw+".");
  parts.push("Where you saw it, and what you were thinking at that moment, often matters more than the number itself.");
  return {s:s,parts:parts};
}

  }
  A.dreamSymbols=symbols;
  A.handlers.openDreamTrail=function(t){
    openId=null; query=t.dataset.symbol||""; selectedSymbol=dateFrom=dateTo="";
    A.go("journal","dreams");
  };
  H.openLinkedDream=function(t){
    var id=Number(t.dataset.id);
    if(!A.dreamEntries().some(function(dream){return dream.id===id;})) return;
    openId=id;
    A.go("journal","dreams");
  };
  function symbolCounts(entries){
    var counts=new Map();
    entries.forEach(function(entry){
      var seen=new Set();
      symbols(entry).forEach(function(label){
        var key=label.toLowerCase();
        if(seen.has(key)) return;
        seen.add(key);
        var current=counts.get(key);
        if(current) current.count++;
        else counts.set(key,{label:label,count:1});
      });
    });
    return counts;
  }
  function localDateKey(value){
    var date=new Date(value);
    return [date.getFullYear(),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-");
  }
  function dreamResults(entries){
    if(dateFrom && dateTo && dateFrom>dateTo) return '<p class="empty" role="status">Choose an end date on or after the start date.</p>';
    var terms=query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var results=entries.filter(function(entry){
      if(dateFrom || dateTo){
        var date=localDateKey(entry.date);
        if((dateFrom && date<dateFrom) || (dateTo && date>dateTo)) return false;
      }
      if(selectedSymbol && !symbols(entry).some(function(label){return label.toLowerCase()===selectedSymbol;})) return false;
      var text=[entry.title,entry.story,entry.feeling,entry.symbols].join(" ").toLowerCase();
      return terms.every(function(term){return text.includes(term);});
    });
    if(!results.length) return '<p class="empty" role="status">No dreams match this search.</p>';
    return '<p class="small muted" role="status">'+results.length+(results.length===1?" dream":" dreams")+'</p>'+
      results.map(function(entry){
        return '<article class="panel dream-entry"><div class="row sp"><button class="journal-open" data-a="dreamOpen" data-id="'+entry.id+
          '">'+esc(entry.title)+'</button><span class="small muted">'+esc(A.fmtShort(new Date(entry.date)))+'</span></div>'+
          (entry.feeling?'<p class="small gold">'+esc(entry.feeling)+'</p>':"")+
          (entry.symbols?'<p class="small muted">'+esc(entry.symbols)+'</p>':"")+
          '<p>'+esc(entry.story.slice(0,170))+(entry.story.length>170?"…":"")+'</p></article>';
      }).join("");
  }
  A.dreamView=function(){
    var entries=A.dreamEntries();
    if(openId===0) return editor({title:"",story:"",feeling:"",symbols:""});
    var active=entries.find(function(entry){return entry.id===openId;});
    if(active) return editor(active);
    var h='<div class="panel"><p>Record what you remember and revisit images or feelings that keep showing up.</p>'+
      '<button class="btn" data-a="dreamOpen" data-id="0">Record a dream</button></div>';
    if(!entries.length){query="";selectedSymbol="";dateFrom="";dateTo="";return h+'<p class="empty">Your saved dreams will appear here.</p>';}
    var recurring=Array.from(symbolCounts(entries).entries()).filter(function(item){return item[1].count>1;});
    recurring.sort(function(a,b){return b[1].count-a[1].count || a[1].label.localeCompare(b[1].label);});
    if(selectedSymbol && !recurring.some(function(item){return item[0]===selectedSymbol;})) selectedSymbol="";
    h+='<div class="panel dream-filters"><label class="f" for="dream-search">Search dreams</label>'+
      '<input id="dream-search" type="text" data-in="dreamSearch" value="'+esc(query)+'" placeholder="Title, feeling, symbol or memory">';
    h+='<div class="dream-date-range"><div><label class="f" for="dream-date-from">From</label>'+
      '<input id="dream-date-from" type="date" data-in="dreamDate" data-edge="from" value="'+esc(dateFrom)+'"></div>'+
      '<div><label class="f" for="dream-date-to">Through</label>'+
      '<input id="dream-date-to" type="date" data-in="dreamDate" data-edge="to" value="'+esc(dateTo)+'"></div></div>'+
      '<button class="btn ghost small dream-clear-dates" data-a="dreamClearDates">Clear dates</button>';
    if(recurring.length){
      h+='<h3>Recurring symbols</h3><div class="row" role="group" aria-label="Filter by recurring symbol">'+recurring.map(function(item){
        return '<button class="btn ghost small" data-a="dreamSymbol" data-symbol="'+esc(item[0])+
          '" aria-pressed="'+(selectedSymbol===item[0])+'">'+esc(item[1].label)+' · '+item[1].count+'</button>';
      }).join("")+'</div>';
    }
    return h+'</div><div id="dream-results">'+dreamResults(entries)+'</div>';
  };
  function updateResults(){
    var target=A.$("#dream-results");
    if(target) target.innerHTML=dreamResults(A.dreamEntries());
  }
  A.inputs.dreamSearch=function(t){
    if(query===t.value) return;
    query=t.value;
    updateResults();
  };
  A.inputs.dreamDate=function(input){
    var value=/^\d{4}-\d{2}-\d{2}$/.test(input.value)?input.value:"";
    if(input.dataset.edge==="from" && value!==dateFrom) dateFrom=value;
    else if(input.dataset.edge==="to" && value!==dateTo) dateTo=value;
    else return;
    updateResults();
  };
  H.dreamClearDates=function(){
    dateFrom=dateTo="";
    A.$("#dream-date-from").value="";
    A.$("#dream-date-to").value="";
    updateResults();
  };
  H.dreamSymbol=function(t){
    selectedSymbol=selectedSymbol===t.dataset.symbol ? "" : t.dataset.symbol;
    A.$$('[data-a="dreamSymbol"]').forEach(function(button){
      button.setAttribute("aria-pressed",String(button.dataset.symbol===selectedSymbol));
    });
    updateResults();
  };

  H.dreamOpen=function(t){openId=+t.dataset.id; A.render(); window.scrollTo(0,0);};
  H.dreamCancel=function(){openId=null; A.render();};
  H.dreamDelete=function(t){
    if(!confirm("Delete this dream?")) return;
    var id=+t.dataset.id;
    if(!A.saveDreams(A.dreamEntries().filter(function(entry){return entry.id!==id;}))){
      A.toast("Could not delete the dream"); return;
    }
    openId=null; A.render();
  };
  document.addEventListener("submit",function(event){
    if(event.target.id!=="dream-editor") return;
    event.preventDefault();
    var title=A.$("#dream-title").value.trim(), story=A.$("#dream-story").value.trim();
    if(!title || !story){ A.toast("Enter a title and what you remember"); return; }
    var entries=A.dreamEntries();
    var entry=entries.find(function(item){return item.id===openId;});
    if(!entry){
      if(openId!==0){ A.toast("This dream is no longer in the journal"); return; }
      var latest=entries.reduce(function(max,item){return Math.max(max,item.id);},0);
      entry={id:Math.max(Date.now(),latest+1),date:new Date().toISOString()};
      entries.unshift(entry);
    }
    entry.title=title; entry.story=story;
    entry.feeling=A.$("#dream-feeling").value.trim();
    entry.symbols=A.$("#dream-symbols").value.trim();
    var select=A.$("#dream-reading"), readingId=select?Number(select.value):0;
    if(readingId&&A.journal().some(function(reading){return reading.id===readingId;})) entry.readingId=readingId;
    else delete entry.readingId;
    if(!A.saveDreams(entries)){ A.toast("Could not save the dream"); return; }
    openId=null; A.render(); A.toast("Dream saved");
  });
})();

      '<div class="mini" aria-hidden="true">'+entry.cards.slice(0,5).map(function(cd){
        return '<div class="journal-thumb'+(cd.rev?" reversed":"")+'">'+A.cardSVG(TM.cards[cd.i],entry.deck)+'</div>';

    h+='<div class="panel"><h3>Brainwave bands</h3>'+TM.bands.map(function(x){ return '<p class="small"><b>'+x.n+'</b> ('+x.r+'). '+esc(x.ex)+'</p>'; }).join("")+'<p class="tiny muted">Research on whether binaural beats change brain state is mixed. Treat them as a relaxation aid.</p></div>';
  } else if(L.mode==="res"){
    h+='<div class="panel"><h3>Intervals: the Pythagorean ratios</h3><label class="f" style="margin-top:0">Base note: <span id="basev">'+L.base+' Hz</span></label><input type="range" min="110" max="440" step="5" value="'+L.base+'" data-in="labbase" style="width:100%">';
    TM.ratios.forEach(function(r,i){ h+='<div class="row sp" style="padding:8px 0;border-top:1px solid var(--line);align-items:flex-start"><div style="flex:1"><b>'+esc(r.n)+'</b> <span class="gold">'+r.r[0]+':'+r.r[1]+'</span><div class="small muted">'+esc(r.d)+'</div></div><button class="say" data-a="playratio" data-i="'+i+'">🎵 Play both</button></div>'; });
    h+='</div>';
    h+='<div class="panel"><h3>Beating: two close notes</h3><p class="small muted">When two notes are almost the same pitch, you hear the sound swell and fade at a rate equal to the difference. This is a real physical beat, made in the air. It is how piano tuners tune. (A binaural beat is different: it happens inside the brain, with one tone in each ear.)</p><label class="f">Difference: <span id="deltav">'+L.delta+' Hz</span></label><input type="range" min="1" max="12" step="1" value="'+L.delta+'" data-in="labdelta" style="width:100%"><button class="btn small" data-a="playbeating" style="margin-top:8px">Play beating notes</button></div>';
  } else if(L.mode==="listen"){
    h+=listeningView();
  } else {
    h+='<div class="panel"><h3>The Harmonic Series</h3><p class="small muted">A single musical note is really a stack: the fundamental, then its double, triple and so on. This plays the fundamental, then adds one overtone every second, up to the eighth, so you can hear a single tone grow into a chord. This is what Pythagoras, and every tuner since, discovered about sound.</p><label class="f">Fundamental: <span id="basev">'+L.base+' Hz</span></label><input type="range" min="55" max="330" step="5" value="'+L.base+'" data-in="labbase" style="width:100%"><button class="btn small" data-a="playharm" style="margin-top:8px">Build the series</button></div>';
  }
  h+='<div class="panel"><h3>Waveform</h3><canvas id="scope" width="600" height="140" style="width:100%;height:auto;background:#0d0820;border-radius:10px"></canvas><p class="tiny muted">The live shape of the sound you are playing.</p></div>';
  return h;
};
var prevAfter=A.after.oracles; A.after.oracles=function(){ if(prevAfter) prevAfter(); if((A.sub.oracles||"")==="lab" && T.playing) A.scopeStart(); };
H.labmode=function(t){
  var mode=t.dataset.m;
  if(!["beats","res","harm","listen"].includes(mode)||mode===A.lab.mode) return;
  A.lab.mode=mode; A.render();
  var button=A.$('[data-a="labmode"][data-m="'+mode+'"]');
  if(button) button.focus({preventScroll:true});
};
H.labdur=function(t){ A.lab.dur=+t.dataset.d; A.render(); };
A.inputs.labbase=function(el){ A.lab.base=+el.value; var s=A.$("#basev"); if(s) s.textContent=el.value+" Hz"; };
A.inputs.labdelta=function(el){ A.lab.delta=+el.value; var s=A.$("#deltav"); if(s) s.textContent=el.value+" Hz"; };
H.playbeat=function(t){
  var b=TM.binaural.filter(function(x){return x.id===t.dataset.id;})[0]; if(!b) return;
  T.start([{f:b.carrier,pan:-1},{f:b.carrier+b.beat,pan:1}],{dur:A.lab.dur,label:b.n+" "+b.beat+" Hz beat"}); A.scopeStart();
};
H.playratio=function(t){
  var r=TM.ratios[+t.dataset.i], b=A.lab.base;
  T.start([{f:b,pan:-0.2},{f:b*r.r[0]/r.r[1],pan:0.2}],{dur:8,label:r.n+" "+r.r[0]+":"+r.r[1]}); A.scopeStart();
};
H.playbeating=function(){ var b=A.lab.base; T.start([{f:b,pan:0},{f:b+A.lab.delta,pan:0}],{dur:12,label:"Beating "+A.lab.delta+" Hz"}); A.scopeStart(); };
H.playharm=function(){ var b=A.lab.base, l=[]; for(var i=1;i<=8;i++) l.push({f:b*i,pan:0,gain:1/i*1.6,at:(i-1)*1.2}); T.start(l,{dur:20,label:"Harmonic series on "+b+" Hz"}); A.scopeStart(); };
// chord of a reading
A.readingChord=function(cards, deckId){
  var seen={}, list=[];
  cards.forEach(function(cd,k){ var c=TM.cards[cd.i], t=TM.freqOfCard(c); var f=t.f; while(f<180) f*=2; while(f>420) f/=2; list.push({f:f,pan:(k%2?0.3:-0.3),at:k*0.7,gain:cd.rev?0.55:1}); });
  T.start(list,{dur:24,label:"Chord of your reading"});
};
H.readingchord=function(){ A.readingChord(A.R.cards,A.R.deck); };
H.playcard=function(t){
  var c=TM.cards[+t.dataset.i], ft=TM.freqOfCard(c);
  if(T.playing && T.label===TM.cardName(c,A.S.deck)+" "+fmt(ft.f)+" Hz"){ T.stop(); return; }
  T.start([{f:ft.f,pan:0}],{dur:30,label:TM.cardName(c,A.S.deck)+" "+fmt(ft.f)+" Hz"});
};
